# SPDX-License-Identifier: AGPL-3.0-only
[package]
name = "seam-core"
version = "0.1.0"
description = "Seam's end-to-end encryption core, built on libsignal"
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
# Pinned to a release tag; bump deliberately and re-run the test vectors
libsignal-protocol = { git = "https://github.com/signalapp/libsignal", tag = "v0.106.1" }
aes-gcm = "0.10"
ed25519-dalek = "3"
futures = "0.3"
prost = "0.14"
rand = "0.9.4"
sha2 = "0.11"
subtle = "2.6"
thiserror = "2"
snow = "0.10"

[build-dependencies]
prost-build = "0.14"
