# PROTOTYPE, throwaway: does UniFFI 0.32 handle async foreign traits from Swift? Never merged.
[package]
name = "proto_uniffi_async"
version = "0.0.0"
edition = "2024"
publish = false

[workspace]

[lib]
crate-type = ["staticlib", "lib"]

[[bin]]
name = "uniffi-bindgen"
path = "src/bin/uniffi-bindgen.rs"

[dependencies]
uniffi = { version = "0.32", features = ["cli", "tokio"] }
async-trait = "0.1"
tokio = { version = "1", features = ["rt-multi-thread", "time", "macros", "sync"] }
thiserror = "2"
