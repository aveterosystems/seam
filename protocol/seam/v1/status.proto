syntax = "proto3";

package seam.v1;

option java_multiple_files = true;
option java_package = "com.avetero.seam.protocol.v1";

// Each device's battery for the other's screen. The phone also sends network, dnd and storage;
// the Mac sends battery only, and nothing at all without a battery.
message Status {
  uint32 battery_pct = 1;
  bool charging = 2;
  string network = 3; // "wifi" | "cellular" | "" (never the Wi‑Fi's name)
  uint32 signal_bars = 4;
  bool dnd = 5; // Do Not Disturb is on
  uint64 storage_free_bytes = 6; // the phone's free space, to the nearest 100 MB
  uint64 storage_total_bytes = 7; // 0 from a phone that doesn't send storage
}
