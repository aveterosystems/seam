syntax = "proto3";

package seam.v1;

option java_multiple_files = true;
option java_package = "com.avetero.seam.protocol.v1";

// Each device's status for the other's screen. The phone sends battery, network, dnd and storage;
// the computer sends battery (or no_battery), storage, CPU and memory: when the phone connects,
// when its battery changes, and in answer to a StatusRequest. Power and times ride along: they
// never send by themselves.
message Status {
  uint32 battery_pct = 1;
  bool charging = 2;
  string network = 3; // "wifi" | "cellular" | "" (never the Wi‑Fi's name)
  uint32 signal_bars = 4;
  bool dnd = 5; // Do Not Disturb is on
  uint64 storage_free_bytes = 6; // free space, to the nearest 100 MB
  uint64 storage_total_bytes = 7; // 0 from a device that doesn't send storage
  optional uint32 cpu_pct = 8; // the computer's CPU in use, 0–100; unset when it couldn't be read
  uint64 memory_used_bytes = 9;
  uint64 memory_total_bytes = 10; // 0 from a device that doesn't send CPU and memory
  bool no_battery = 11; // a computer without a battery (battery_pct and charging mean nothing)
  // The battery's power right now, in milliwatts: into it while charging, out of it otherwise.
  // Unset when the device can't read it (or is older).
  optional uint32 power_mw = 12;
  optional uint32 minutes_to_full = 13; // while charging; unset when not known yet
  optional uint32 minutes_left = 14; // on battery, an estimate; unset when not known yet
}

// Either device asks for the other's status now: its sheet of the other's resources, or its
// battery details, are open. An older device ignores it.
message StatusRequest {}
