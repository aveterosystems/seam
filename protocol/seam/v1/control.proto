syntax = "proto3";

package seam.v1;

option java_multiple_files = true;
option java_package = "com.avetero.seam.protocol.v1";

message Control {
  oneof body {
    Hello hello = 1;
    Ack ack = 2;
    Ping ping = 3;
    Unpair unpair = 4;
    PairRequest pair_request = 5;
    PairAccept pair_accept = 6;
  }
}

// Sent on every connect. A feature only sends payloads once the peer lists its capability,
// which is how the play build (no SMS) and full build coexist and new features stay dark.
message Hello {
  string app_version = 1; // "1.2.0"
  string platform = 2; // "macos" | "android"
  repeated string capabilities = 3; // "clipboard.v1", "files.v1", "notifications.reply", "messages.sms", ...
  // The connection switches on this device. The peer never sends over a transport missing
  // here (only paths allowed at both ends are used; decision 0006). Sent whenever a path to the
  // peer comes up and whenever the switches change.
  repeated Transport allowed_transports = 4;
  // Counts up by one with every Hello this device sends to this peer (persisted; restarts at 1
  // with a new pairing). The receiver applies a Hello only if seq is higher than the last one it
  // applied, so a delayed or replayed old Hello can't switch a path back on. Never clock-based.
  uint64 seq = 5;
  // The phone's pause (only the phone pauses; the Mac sends 0). Unix ms when it ends, INT64 max
  // until the phone resumes, 0 not paused. In the Hello so it's ordered by seq and sent on every
  // connection: a late or replayed message can't re-pause a resumed Mac. While paused nothing is
  // captured or sent either way, the phone makes no connections, and the Mac keeps listening.
  int64 paused_until_ms = 6;
  // The links this device has open to the peer right now. A link the receiver still has up but
  // that isn't listed is dead (the network went away without closing it, e.g. the phone left the
  // Wi‑Fi): the receiver closes it and sends again on another. So a Hello also goes whenever a
  // link closes while another stays open. Unset (an older app): nothing is closed.
  OpenLinks open_links = 7;
}

message OpenLinks {
  repeated Transport transports = 1;
}

enum Transport {
  TRANSPORT_UNSPECIFIED = 0;
  TRANSPORT_LAN = 1; // same network, direct
  TRANSPORT_RELAY = 2; // retired with the relay (decision 0009); never reused
  TRANSPORT_TOR = 4; // internet, through Tor to the Mac's private onion service
  TRANSPORT_BLUETOOTH = 3; // direct Bluetooth LE (decision 0006; not built yet)
}

// Sent once a payload is handled. Every payload except Ack and Ping gets one.
message Ack {
  bytes msg_id = 1;
}

message Ping {
  int64 sent_at = 1;
}

// The other device forgot us; delete its keys and stop sending.
message Unpair {}

// The phone's first message after scanning the QR code, proving it holds the one-time token.
message PairRequest {
  bytes pairing_token = 1;
  string device_name = 2; // "Pixel 9", at most 64 characters, no control characters
  string model = 3;
  bytes relay_key = 4; // the phone's relay key, inside the encryption: must equal Envelope.from
}

// The user confirmed the code on the Mac.
message PairAccept {}
