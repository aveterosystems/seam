# SPDX-License-Identifier: AGPL-3.0-only
name = "seam-relay"
main = "src/index.ts"
compatibility_date = "2026-10-01"

# The relay's long-lived address: stored in every pairing, so it must not change (SR-5-02)
routes = [{ pattern = "relay.avetero.com", custom_domain = true }]
# The account's workers.dev address is off: every pairing uses relay.avetero.com, and it was the
# only place the account name showed (SR-5-02)
workers_dev = false

# One Durable Object per pairing group: live sockets, offline queue, prekey bundles, pairing slot
[[durable_objects.bindings]]
name = "PAIR_GROUP"
class_name = "PairGroup"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["PairGroup"]

# Connects per client IP. The IP is only the limiter's key: never logged or stored.
[[ratelimits]]
name = "CONNECT_LIMITER"
namespace_id = "1001"

  [ratelimits.simple]
  limit = 30
  period = 60

# Pinned off: request logs would record group ids (in the URL) and client IPs
[observability]
enabled = false

# R2 (file chunks) and push secrets arrive with the features that need them (docs/architecture/infrastructure.md)
