name: core
on:
  push:
    branches: [main]
    paths: ["core/**", ".github/workflows/core.yml", "!**/*.md"]
  pull_request:
    paths: ["core/**", ".github/workflows/core.yml", "!**/*.md"]

# A newer push to the same branch or PR cancels this run; it's been superseded
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: core } }
    steps:
      - uses: actions/checkout@v5
      # libsignal's post-quantum ratchet (spqr) compiles .proto files at build time
      - uses: arduino/setup-protoc@v3
        with: { repo-token: "${{ secrets.GITHUB_TOKEN }}" }
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: core }
      # rustup reads core/rust-toolchain.toml and installs the pinned toolchain
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
