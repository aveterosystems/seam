name: release
# Pushing a version tag (v0.1.0) on main builds both apps, signs them with Seam's own keys, and
# opens a draft release with checksums and build attestations. The maintainer reviews and publishes.
#
# Nightly: each night, if main has changed since the last nightly (or on demand), the same jobs
# build main as the next patch's pre-release (0.3.1-nightly.202611030200) and publish it as a
# nightly-… pre-release, plus the feed Mac nightly users follow. Apps get nightlies only with
# Updates › Nightly builds on; GitHub's "latest release" skips pre-releases.
#
# Builds run with no secrets. Signing runs in its own jobs on fresh runners, in the `release`
# environment (required reviewer, v* tags only) or, for nightlies, the `nightly` environment (main
# only, no reviewer), and runs only the signing tools: zipalign and apksigner, codesign and
# security, and Sparkle's sign_update (pinned by SHA-256) (SR-14-01, 02).
on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch: # a nightly now, even if main hasn't changed

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run: { shell: bash } # -eo pipefail (SR-14-10)

env:
  CARGO_NDK: "4.1.2"
  XCODEGEN: "2.46.0"
  XCODEGEN_SHA256: "4d9e34b62172d645eed6457cac13fc222569974098ef4ee9c3368bedf0196806"
  # Sparkle's sign_update signs Mac updates and the appcast; the app's Sparkle comes from SwiftPM
  SPARKLE: "2.10.0"
  SPARKLE_SHA256: "c2bf58aa8387266ac179357b1415d6f2635f044da8be41042af32425dae6da0c"

jobs:
  versions:
    runs-on: ubuntu-24.04
    permissions: { contents: read }
    outputs:
      version: ${{ steps.v.outputs.version }}
      build: ${{ steps.v.outputs.build }}
      tag: ${{ steps.v.outputs.tag }}
      previous: ${{ steps.v.outputs.previous }}
      nightly: ${{ steps.v.outputs.nightly }}
      skip: ${{ steps.v.outputs.skip }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with: { persist-credentials: false, fetch-depth: 0 }
      # A release: the tag is on main, versions match it and go up, pins are well formed.
      # A nightly: built from main, numbered after the last release, skipped if main hasn't changed
      - name: Version, build number and tag
        id: v
        env:
          FORCE: ${{ github.event_name == 'workflow_dispatch' && 'force' || '' }}
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            scripts/check-release.sh "$GITHUB_REF_NAME"
            # Numbered now, not when release.sh ran: a nightly built during the release PR's review
            # must not outrank the release, or neither platform would install it over that nightly
            echo "build=$(scripts/build-number.sh)"
            echo "tag=$GITHUB_REF_NAME"
            echo "nightly=false"
            echo "skip=false"
          else
            scripts/nightly-version.sh ${FORCE:+"$FORCE"}
            echo "nightly=true"
          fi >> "$GITHUB_OUTPUT"

  build-android:
    needs: versions
    if: needs.versions.outputs.skip != 'true'
    runs-on: ubuntu-24.04
    permissions: { contents: read }
    defaults: { run: { working-directory: apps/android } }
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with: { persist-credentials: false }
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with: { distribution: temurin, java-version: "17" }
      # No build cache in a release: everything is built from the tagged sources
      - uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5
        with: { cache-disabled: true }
      - uses: arduino/setup-protoc@c65c819552d16ad3c9b72d9dfd5ba5237b9c906b # v3
        with: { repo-token: "${{ secrets.GITHUB_TOKEN }}" }
      - name: Rust Android targets, cargo-ndk ${{ env.CARGO_NDK }} and the NDK
        run: |
          cd ../../core && rustup target add aarch64-linux-android armv7-linux-androideabi x86_64-linux-android
          cargo install cargo-ndk --locked --version "$CARGO_NDK"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;29.0.14206865" > /dev/null
      - name: This build's version (a release's files already carry it)
        env: { VERSION: "${{ needs.versions.outputs.version }}", BUILD: "${{ needs.versions.outputs.build }}" }
        run: ../../scripts/set-version.sh "$VERSION" "$BUILD"
      # The tests of the variant that ships (CI tests the debug ones)
      - name: Tests, then the unsigned full build
        run: ./gradlew testReleaseUnitTest testFullReleaseUnitTest assembleFullRelease
      - run: mkdir -p ../../dist && cp app/build/outputs/apk/full/release/app-full-release-unsigned.apk ../../dist/unsigned.apk
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with: { name: android-unsigned, path: dist/, if-no-files-found: error, retention-days: 1 }

  build-mac:
    needs: versions
    if: needs.versions.outputs.skip != 'true'
    runs-on: macos-26
    permissions: { contents: read }
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with: { persist-credentials: false }
      - uses: arduino/setup-protoc@c65c819552d16ad3c9b72d9dfd5ba5237b9c906b # v3
        with: { repo-token: "${{ secrets.GITHUB_TOKEN }}" }
      - name: This build's version (a release's files already carry it)
        env: { VERSION: "${{ needs.versions.outputs.version }}", BUILD: "${{ needs.versions.outputs.build }}" }
        run: scripts/set-version.sh "$VERSION" "$BUILD"
      - name: Rust core for Apple silicon and Intel
        run: ARCHS="arm64 x86_64" scripts/build-mac-core.sh
      - name: Swift tests
        run: |
          swift test --package-path apps/mac/Packages/SeamCore
          swift test --package-path apps/mac/Packages/SeamProtocol
          swift test --package-path apps/mac/Packages/SeamSession
      - name: XcodeGen ${{ env.XCODEGEN }}, checked against its pinned SHA-256
        run: |
          curl -sSfL -o "$RUNNER_TEMP/xcodegen.zip" "https://github.com/yonaskolb/XcodeGen/releases/download/$XCODEGEN/xcodegen.zip"
          echo "$XCODEGEN_SHA256  $RUNNER_TEMP/xcodegen.zip" | shasum -a 256 -c -
          unzip -q "$RUNNER_TEMP/xcodegen.zip" -d "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/xcodegen/bin" >> "$GITHUB_PATH"
      - name: Release build (universal, unsigned), packages exactly as pinned
        run: |
          cd apps/mac && xcodegen generate
          # Sparkle and SwiftProtobuf at the commits in apps/mac/Package.resolved, nothing newer (SR-17-03)
          mkdir -p Seam.xcodeproj/project.xcworkspace/xcshareddata/swiftpm
          cp Package.resolved Seam.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved
          xcodebuild -project Seam.xcodeproj -scheme Seam -configuration Release \
            -onlyUsePackageVersionsFromResolvedFile -disableAutomaticPackageResolution \
            -derivedDataPath "$RUNNER_TEMP/dd" CODE_SIGNING_ALLOWED=NO build | tail -20
          app="$RUNNER_TEMP/dd/Build/Products/Release/Seam.app"
          test "$(lipo -archs "$app/Contents/MacOS/Seam")" = "x86_64 arm64"
          mkdir -p ../../dist && ditto -c -k --keepParent "$app" ../../dist/unsigned.zip
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with: { name: mac-unsigned, path: dist/, if-no-files-found: error, retention-days: 1 }

  sign-android:
    needs: [versions, build-android]
    runs-on: ubuntu-24.04
    environment: ${{ needs.versions.outputs.nightly == 'true' && 'nightly' || 'release' }}
    permissions: { contents: read }
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with: { persist-credentials: false, sparse-checkout: "release\nscripts" }
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with: { name: android-unsigned, path: in }
      - name: Align, sign with Seam's key, check it's the pinned one
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          VERSION: ${{ needs.versions.outputs.version }}
        run: |
          keys="$(mktemp -d)"
          trap 'rm -rf "$keys"' EXIT
          (umask 077; base64 -d <<< "$KEYSTORE_BASE64" > "$keys/release.p12")
          mkdir -p dist
          ANDROID_KEYSTORE="$keys/release.p12" ANDROID_KEYSTORE_PASSWORD="$KEYSTORE_PASSWORD" \
            scripts/sign-android-apk.sh in/unsigned.apk "dist/Seam-$VERSION-android.apk"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with: { name: android, path: dist/, if-no-files-found: error, retention-days: 7 }

  sign-mac:
    needs: [versions, build-mac]
    runs-on: macos-26
    environment: ${{ needs.versions.outputs.nightly == 'true' && 'nightly' || 'release' }}
    permissions: { contents: read }
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with: { persist-credentials: false, sparse-checkout: "release\nscripts\napps/mac/Config" }
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with: { name: mac-unsigned, path: in }
      - name: Sparkle ${{ env.SPARKLE }}'s sign_update, checked against its pinned SHA-256
        run: |
          curl -sSfL -o "$RUNNER_TEMP/sparkle.tar.xz" "https://github.com/sparkle-project/Sparkle/releases/download/$SPARKLE/Sparkle-$SPARKLE.tar.xz"
          echo "$SPARKLE_SHA256  $RUNNER_TEMP/sparkle.tar.xz" | shasum -a 256 -c -
          mkdir -p "$RUNNER_TEMP/sparkle" && tar -xf "$RUNNER_TEMP/sparkle.tar.xz" -C "$RUNNER_TEMP/sparkle" ./bin/sign_update
      - name: Sign with Seam's pinned certificate, zip, sign the update and the appcast
        env:
          P12_BASE64: ${{ secrets.MAC_SIGNING_P12_BASE64 }}
          MAC_SIGNING_P12_PASSWORD: ${{ secrets.MAC_SIGNING_P12_PASSWORD }}
          SPARKLE_KEY: ${{ secrets.SPARKLE_ED_PRIVATE_KEY }}
          VERSION: ${{ needs.versions.outputs.version }}
          TAG: ${{ needs.versions.outputs.tag }}
          # A nightly has no CHANGELOG.md section: Sparkle's window says what it is instead
          CHANGES: "${{ needs.versions.outputs.nightly == 'true' && 'A nightly build of main: the newest work, less tested than a release.' || '' }}"
        run: |
          keys="$(mktemp -d)"
          trap 'rm -rf "$keys"' EXIT
          (umask 077; base64 -d <<< "$P12_BASE64" > "$keys/signing.p12"; printf '%s\n' "$SPARKLE_KEY" > "$keys/sparkle.key")
          # From here on only files carry the keys, so nothing else this step runs inherits them (SR-17-12)
          unset P12_BASE64 SPARKLE_KEY
          ditto -x -k in/unsigned.zip "$keys/app"
          app="$keys/app/Seam.app"
          MAC_SIGNING_P12="$keys/signing.p12" scripts/sign-mac-app.sh "$app"
          mkdir -p dist && ditto -c -k --keepParent "$app" "dist/Seam-$VERSION-mac.zip"
          build="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$app/Contents/Info.plist")"
          public="$(/usr/libexec/PlistBuddy -c 'Print :SUPublicEDKey' "$app/Contents/Info.plist")"
          EXPECTED_PUBLIC_KEY="$public" SPARKLE_KEY_FILE="$keys/sparkle.key" SIGN_UPDATE="$RUNNER_TEMP/sparkle/bin/sign_update" \
            scripts/make-appcast.sh "dist/Seam-$VERSION-mac.zip" "$VERSION" "$build" dist/appcast.xml
      - name: The signed app launches (Sparkle loads; no keys in this step)
        env:
          VERSION: ${{ needs.versions.outputs.version }}
        run: |
          t="$(mktemp -d)"
          ditto -x -k "dist/Seam-$VERSION-mac.zip" "$t"
          "$t/Seam.app/Contents/MacOS/Seam" & pid=$!
          sleep 10
          # A refused framework kills it at launch; still running means it loaded (SR-17-01)
          kill -0 "$pid" || { echo "Seam.app exited at launch" >&2; exit 1; }
          kill "$pid"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with: { name: mac, path: dist/, if-no-files-found: error, retention-days: 7 }

  release:
    needs: [versions, sign-android, sign-mac]
    runs-on: ubuntu-24.04
    permissions:
      contents: write     # the draft release
      id-token: write     # build attestations (Sigstore)
      attestations: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with: { persist-credentials: false, fetch-depth: 0 }
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with: { name: android, path: dist }
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with: { name: mac, path: dist }
      - name: Checksums, and every file a release needs
        working-directory: dist
        run: |
          # The Mac updater reads releases/latest/download/appcast.xml: a release without it stops Mac updates (SR-17-17)
          for f in "Seam-${{ needs.versions.outputs.version }}-android.apk" "Seam-${{ needs.versions.outputs.version }}-mac.zip" appcast.xml; do
            test -s "$f" || { echo "Missing $f" >&2; exit 1; }
          done
          sha256sum Seam-* > SHA256SUMS && cat SHA256SUMS
      - uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3
        with: { subject-path: "dist/Seam-*\ndist/SHA256SUMS\ndist/appcast.xml" }
      - name: Draft release
        if: needs.versions.outputs.nightly != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.versions.outputs.version }}
        run: |
          # Pins are checked as 64 hex characters in the versions job, so they're safe in sed
          sed -e "s/{VERSION}/$VERSION/g" \
              -e "s/{ANDROID_CERT}/$(tr -d '[:space:]' < release/android-certificate.sha256)/" \
              -e "s/{MAC_CERT}/$(tr -d '[:space:]' < release/mac-certificate.sha256)/" \
              release/notes.md > "$RUNNER_TEMP/template.md"
          # The Android app reads "## What's changed" from this release's notes to show on its Update card
          scripts/changes.sh "$VERSION" > "$RUNNER_TEMP/changes.md"
          awk -v f="$RUNNER_TEMP/changes.md" '$0 == "{CHANGES}" { while ((getline l < f) > 0) print l; next } 1' \
            "$RUNNER_TEMP/template.md" > "$RUNNER_TEMP/notes.md"
          gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --draft --verify-tag \
            --title "Seam $VERSION" --notes-file "$RUNNER_TEMP/notes.md"
      - name: Nightly pre-release, and the feed Mac nightly users follow
        if: needs.versions.outputs.nightly == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.versions.outputs.version }}
          TAG: ${{ needs.versions.outputs.tag }}
          PREVIOUS: ${{ needs.versions.outputs.previous }}
        run: |
          since="${PREVIOUS:-$(git describe --tags --abbrev=0 --match 'v[0-9]*.[0-9]*.[0-9]*')}"
          # The Android app shows "## What's changed" on its Update card, as for a release
          { echo "A nightly build of main: the newest work, less tested than a release. Seam offers it only with Settings › Updates › Nightly builds on."
            echo; echo "## What's changed"; echo
            # sed, not grep -v: an empty list (only a Release commit since) must not fail under pipefail
            git log --format='- %s' "$since..$GITHUB_SHA" | sed -e '/^- Release [0-9]/d' -e 's/ (#[0-9]*)$//' | sed -n '1,50p'
          } > "$RUNNER_TEMP/notes.md"
          gh release create "$TAG" dist/* --repo "$GITHUB_REPOSITORY" --prerelease --target "$GITHUB_SHA" \
            --title "Seam $VERSION" --notes-file "$RUNNER_TEMP/notes.md"
          # Mac nightly users' Sparkle reads releases/download/nightly/appcast.xml: one fixed address
          gh release view nightly --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 \
            || gh release create nightly --repo "$GITHUB_REPOSITORY" --prerelease --target "$GITHUB_SHA" --title "Nightly feed" \
                 --notes "Holds appcast.xml, the feed Seam for Mac follows with Nightly builds on. The builds are the nightly-… pre-releases."
          # --clobber replaces the old feed: retried, and if it still fails the next night rebuilds (nightly-version.sh
          # skips only when the published feed is this nightly's)
          for attempt in 1 2 3; do
            gh release upload nightly dist/appcast.xml --repo "$GITHUB_REPOSITORY" --clobber && break
            [ "$attempt" = 3 ] && { echo "Couldn't publish the nightly feed" >&2; exit 1; }
            sleep 10
          done
