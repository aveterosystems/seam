name: protocol
on:
  push:
    branches: [main]
    paths: ["protocol/**", ".github/workflows/protocol.yml", "!**/*.md"]
  pull_request:

# A newer push to the same PR cancels this run; it's been superseded. Runs on main finish, so
# each one saves the build cache that PRs start from
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Which parts changed. Skipped jobs count as passed, so required checks never block an unrelated PR.
  changes:
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.filter.outputs.run }}
    steps:
      - uses: actions/checkout@v5
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          predicate-quantifier: every
          filters: |
            run:
              - '{protocol/**,.github/workflows/protocol.yml}'
              - '!**/*.md'

  protocol:
    needs: changes
    if: github.event_name == 'push' || needs.changes.outputs.run == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # Lints, and on pull requests fails any wire-breaking change against main
      - uses: bufbuild/buf-action@v1
        with:
          input: protocol
          breaking_against: "${{ github.event.repository.clone_url }}#branch=main,subdir=protocol"
          breaking: ${{ github.event_name == 'pull_request' }}
          push: false
          pr_comment: false
