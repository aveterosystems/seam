name: protocol
on:
  push:
    branches: [main]
    paths: ["protocol/**", ".github/workflows/protocol.yml", "!**/*.md"]
  pull_request:
    paths: ["protocol/**", ".github/workflows/protocol.yml", "!**/*.md"]

# A newer push to the same branch or PR cancels this run; it's been superseded
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  buf:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # Lints, and on pull requests fails any wire-breaking change against main
      - uses: bufbuild/buf-action@v1
        with:
          input: protocol
          breaking_against: "${{ github.event.repository.clone_url }}#branch=main,subdir=protocol"
          # shortcut: off until protocol/ exists on main (nothing to compare against yet); then use
          # breaking: ${{ github.event_name == 'pull_request' }}
          breaking: false
          push: false
          pr_comment: false
