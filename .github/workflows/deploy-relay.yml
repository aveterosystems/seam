name: deploy-relay
# Deploys the relay to Cloudflare. Only when the maintainer runs it from the Actions tab, and only
# a commit that's on main, so nothing deploys that didn't pass review (SR-5-01). Never on a PR.
on:
  workflow_dispatch:

concurrency:
  group: deploy-relay
  cancel-in-progress: false # never stop a deploy halfway

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    # The production environment must require the maintainer's approval and allow only main
    # (server/README.md, "Deploying"); its Cloudflare secrets are released to this job only then
    environment: production
    defaults: { run: { working-directory: server } }
    steps:
      # Pinned to commits, not tags, in the one workflow that holds a deploy credential (SR-5-04)
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
      - name: Refuse anything that isn't on main
        run: git merge-base --is-ancestor "$GITHUB_SHA" origin/main
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      # The locked wrangler only: npm run never downloads a different version (SR-5-03)
      - run: npm run deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
