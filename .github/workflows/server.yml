name: server
on:
  push:
    branches: [main]
    paths: ["server/**", "protocol/**", ".github/workflows/server.yml", "!**/*.md"]
  pull_request:

# A newer push to the same PR cancels this run; it's been superseded. Runs on main finish, so
# each one saves the build cache that PRs start from
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Which parts changed. Skipped jobs count as passed, so required checks never block an unrelated PR.
  changes:
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.filter.outputs.run }}
    steps:
      - uses: actions/checkout@v5
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          predicate-quantifier: every
          filters: |
            run:
              - '{server/**,protocol/**,.github/workflows/server.yml}'
              - '!**/*.md'

  server:
    needs: changes
    if: github.event_name == 'push' || needs.changes.outputs.run == 'true'
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: server } }
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: "22", cache: npm, cache-dependency-path: server/package-lock.json }
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
