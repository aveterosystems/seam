name: server
on:
  push:
    branches: [main]
    paths: ["server/**", "protocol/**", ".github/workflows/server.yml", "!**/*.md"]
  pull_request:
    paths: ["server/**", "protocol/**", ".github/workflows/server.yml", "!**/*.md"]

# A newer push to the same branch or PR cancels this run; it's been superseded
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: server } }
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: "22", cache: npm, cache-dependency-path: server/package-lock.json }
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
