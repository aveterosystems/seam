name: mac
on:
  push:
    branches: [main]
    paths: ["apps/mac/**", "core/**", "protocol/**", "scripts/**", ".github/workflows/mac.yml", "!**/*.md"]
  pull_request:

# A newer push to the same branch or PR cancels this run; it's been superseded
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Must match the SwiftProtobuf version in apps/mac/Packages/SeamProtocol/Package.swift
  SWIFT_PROTOBUF: "1.39.0"

jobs:
  # Which parts changed. Skipped jobs count as passed, so required checks never block an unrelated PR.
  changes:
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.filter.outputs.run }}
    steps:
      - uses: actions/checkout@v5
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          predicate-quantifier: every
          filters: |
            run:
              - '{apps/mac/**,core/**,protocol/**,scripts/**,.github/workflows/mac.yml}'
              - '!**/*.md'

  mac:
    needs: changes
    if: github.event_name == 'push' || needs.changes.outputs.run == 'true'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      # libsignal's post-quantum ratchet (spqr) compiles .proto files at build time
      - uses: arduino/setup-protoc@v3
        with: { repo-token: "${{ secrets.GITHUB_TOKEN }}" }
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: core }

      - name: protoc-gen-swift ${{ env.SWIFT_PROTOBUF }}, built from source so codegen is reproducible
        run: |
          git clone -q --depth 1 --branch "$SWIFT_PROTOBUF" https://github.com/apple/swift-protobuf "$RUNNER_TEMP/swift-protobuf"
          swift build -c release --package-path "$RUNNER_TEMP/swift-protobuf" --product protoc-gen-swift
          echo "$RUNNER_TEMP/swift-protobuf/.build/release" >> "$GITHUB_PATH"

      - name: Generated code matches its sources (UniFFI bindings, Swift protocol)
        run: |
          scripts/gen-bindings.sh
          scripts/gen-protocol.sh
          git diff --exit-code -- apps/

      - name: Rust core → SeamCoreFFI.xcframework
        run: scripts/build-mac-core.sh

      - name: Swift tests (core bindings, protocol golden vector, relay session)
        run: |
          swift test --package-path apps/mac/Packages/SeamCore
          swift test --package-path apps/mac/Packages/SeamProtocol
          swift test --package-path apps/mac/Packages/SeamSession

      - name: Build the app
        run: |
          brew install xcodegen
          cd apps/mac && xcodegen generate
          xcodebuild -project Seam.xcodeproj -scheme Seam -configuration Debug \
            -destination "platform=macOS,arch=$(uname -m)" CODE_SIGNING_ALLOWED=NO build | tail -20
          test "${PIPESTATUS[0]}" -eq 0
