# XcodeGen spec for the Mac app. The .xcodeproj is generated from this and never committed:
#   scripts/build-mac-core.sh && (cd apps/mac && xcodegen generate) && open apps/mac/Seam.xcodeproj
name: Seam
options:
  bundleIdPrefix: com.avetero
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    ENABLE_HARDENED_RUNTIME: YES

packages:
  SeamCore:
    path: Packages/SeamCore
  SeamProtocol:
    path: Packages/SeamProtocol
  SeamSession:
    path: Packages/SeamSession
  # In-app updates. Exact version; SwiftPM checks the framework against Sparkle's published checksum.
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    exactVersion: 2.10.0

targets:
  Seam:
    type: application
    platform: macOS
    sources: [Seam]
    dependencies:
      - package: SeamCore
      - package: SeamProtocol
      - package: SeamSession
      - package: Sparkle
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.avetero.seam
        PRODUCT_NAME: Seam
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Seam
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.utilities
        # Menu bar only: no Dock icon, no main window until asked for
        INFOPLIST_KEY_LSUIElement: YES
        INFOPLIST_KEY_NSHumanReadableCopyright: "© 2026 Avetero. Licensed under AGPL-3.0."
      configs:
        # Local networking for dev relays (plain ws://) in Debug only; Release has no ATS exception
        Debug:
          INFOPLIST_FILE: Config/Debug-Info.plist
        # Sparkle's feed and the public key that every update and the feed itself must be signed with
        Release:
          INFOPLIST_FILE: Config/Release-Info.plist
    scheme: {}
